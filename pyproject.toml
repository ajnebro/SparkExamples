[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-introduction-codes"
version = "0.1.0.dev0"
description = "Introductory code examples for Apache Spark 4.2.0 in Python"
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
